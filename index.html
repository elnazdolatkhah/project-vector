<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>PROJECT VECTOR — AI Studio Migration Baseline</title>
  <style>
    :root{color-scheme:dark;--bg:#020407;--cyan:#51ded8;--blue:#5fd2ff;--amber:#ffc04a;--text:#eaf7ff;--muted:#77909f}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Inter,system-ui,sans-serif;color:var(--text)}
    body{display:flex;justify-content:center;align-items:center}
    .phone{position:relative;width:min(100vw,430px);height:100dvh;max-height:920px;background:var(--bg);overflow:hidden}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    .top{position:absolute;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:center;gap:8px;pointer-events:none}
    .stage{font-weight:800;font-size:12px;letter-spacing:.08em;flex:1;text-shadow:0 2px 7px #000}
    .top button,.bottom button{pointer-events:auto;border:1px solid rgba(95,210,255,.28);background:rgba(2,7,11,.72);color:var(--text);border-radius:999px;min-width:40px;height:40px;font-weight:800}
    .future{position:absolute;left:50%;transform:translateX(-50%);bottom:max(66px,calc(env(safe-area-inset-bottom) + 58px));max-width:calc(100% - 28px);padding:7px 12px;border-radius:999px;background:rgba(2,7,11,.72);border:1px solid rgba(81,222,216,.26);font-size:10px;font-weight:800;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
    .angle{position:absolute;right:14px;bottom:max(112px,calc(env(safe-area-inset-bottom) + 104px));font-size:20px;font-weight:900;color:var(--cyan);text-shadow:0 2px 8px #000;pointer-events:none}
    .bottom{position:absolute;left:10px;right:10px;bottom:max(8px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;pointer-events:none}
    .gesture{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);font-size:11px;color:var(--muted);text-align:center;pointer-events:none}
    @media(min-width:431px){.phone{border-radius:28px;box-shadow:0 24px 80px rgba(0,0,0,.65)}}
  </style>
</head>
<body>
  <main class="phone">
    <canvas id="game"></canvas>
    <div class="top"><div class="stage" id="stageText"></div><button id="nextButton" aria-label="Next level">›</button></div>
    <div class="gesture">DRAG ON THE FIELD TO EXPLORE A FUTURE<br>RELEASE TO CHOOSE IT</div>
    <div class="angle" id="angleText">45.0°</div>
    <div class="future" id="futureText">CALCULATING…</div>
    <div class="bottom"><button id="resetButton">↻</button></div>
  </main>
  <script type="module" src="/src/ui/app.js"></script>
</body>
</html>
